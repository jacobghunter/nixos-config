[bar.default]
capsule_foreground = "primary"
capsule_radius = 8
center = [ "clock", "spacer_2", "weather" ]
end = [ "tray", "bluetooth", "network", "volume", "brightness", "battery", "notifications", "session" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "wallpaper", "w-engine-widget", "workspaces", "media" ]
widget_spacing = 10

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 368.0
    box_width = 1152.0
    cx = 1720.0
    cy = 1248.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        bands = 32
        show_when_idle = true

[hot_corners]
delay_ms = 350
enabled = true

    [hot_corners.bottom_right]
    action = "launcher"

    [hot_corners.top_left]
    action = "window_switcher"

    [hot_corners.top_right]
    action = "control_center"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "tadomika_ari/w-engine" ]

[shell]
font_family = "JetBrainsMono NF"
settings_window_translucent = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.launcher]
    pinned = [ "discord", "spotify", "bitwarden" ]

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"

    [shell.screen_corners]
    size = 16

[theme]
builtin = "Dracula"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt" ]

[wallpaper]
enabled = false

    [wallpaper.default]
    path = "/nix/store/n693cp917rzr0wxsr3rh3wxlhk4x9jn8-noctalia-5.3.0/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/home/jacob/.local/share/Steam/steamapps/workshop/content/431960/2557395646/preview.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/jacob/.local/share/Steam/steamapps/workshop/content/431960/2557395646/preview.jpg"

[widget.bluetooth]
hide_when_adapter_off = true
hide_when_no_connected_device = true
show_label = true

[widget.clock]
format = "{:%A %B %e %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 300
show_progress = true

[widget.spacer_2]
length = 30
type = "spacer"

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.wallpaper]
anchor = true
enabled = false

[widget.workspaces]
active_pill_size = 1.6000000000000001
occupied_color = "surface"
urgent_color = "secondary"
