[bar.default]
capsule_foreground = "primary"
capsule_radius = 8
center = [ "clock", "spacer_2", "weather" ]
end = [ "tray", "bluetooth", "network", "volume", "brightness", "battery", "notifications", "session" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "launcher", "wallpaper", "workspaces", "media" ]
widget_spacing = 10

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
schema_version = 2

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[hot_corners]
delay_ms = 350
enabled = true

    [hot_corners.bottom_right]
    action = "launcher"

    [hot_corners.top_left]
    action = "window_switcher"

    [hot_corners.top_right]
    action = "control_center"

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[shell]
font_family = "JetBrainsMono NF"
settings_window_translucent = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.launcher]
    pinned = [ "discord", "spotify", "bitwarden" ]

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "center"

    [shell.screen_corners]
    size = 16

[theme]
builtin = "Dracula"
community_palette = "Oxocarbon"
mode = "dark"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt" ]

[wallpaper]
enabled = false

[widget.bluetooth]
hide_when_adapter_off = true
hide_when_no_connected_device = true
show_label = true

[widget.clock]
format = "{:%A %B %e %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 300
show_progress = true

[widget.spacer_2]
length = 30
type = "spacer"

[widget.wallpaper]
anchor = true
enabled = false

[widget.workspaces]
active_pill_size = 1.6000000000000001
occupied_color = "on_primary"
urgent_color = "secondary"
